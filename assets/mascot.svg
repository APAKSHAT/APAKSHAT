<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" role="img" aria-label="gapbot, a little robot, spots a gap and builds a bridge across it: observe gaps, build solutions">
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f5af0"/><stop offset="1" stop-color="#2cb67d"/></linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9b82ff"/><stop offset="1" stop-color="#5b4bdb"/></linearGradient>
  <linearGradient id="torso" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a55e8"/><stop offset="1" stop-color="#4b36a8"/></linearGradient>
  <linearGradient id="solution" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7f5af0"/><stop offset="1" stop-color="#2cb67d"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#2cb67d" stop-opacity=".55"/><stop offset="1" stop-color="#2cb67d" stop-opacity="0"/></radialGradient>
</defs>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .say { font-size: 17px; font-weight: 700; fill: #fffffe; }
  .lbl { font-size: 13px; font-weight: 700; }
</style>

<rect x="1" y="1" width="858" height="278" rx="14" fill="#0f0e17" stroke="url(#edge)" stroke-width="2"/>

<!-- twinkling stars -->
<g fill="#c6b8fa">
  <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="110" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="610" cy="40" r="1.6"><animate attributeName="opacity" values=".3;1;.3" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="90" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="140" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="150" r="1.3"><animate attributeName="opacity" values=".4;1;.4" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="30" r="1.4"><animate attributeName="opacity" values="1;.3;1" dur="4s" repeatCount="indefinite"/></circle>
</g>

<!-- speech bubble: cycles through the motto -->
<g>
  <rect x="250" y="26" width="290" height="50" rx="14" fill="#16161a" stroke="#7f5af0" stroke-width="2"/>
  <path d="M262 62 L232 82 L278 70 Z" fill="#16161a" stroke="#7f5af0" stroke-width="2" stroke-linejoin="round"/>
  <rect x="263" y="58" width="22" height="14" fill="#16161a"/>
  <text x="395" y="57" text-anchor="middle" class="say" opacity="0">hi! i'm gapbot.
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.11;.13;1" dur="8s" repeatCount="indefinite"/></text>
  <text x="395" y="57" text-anchor="middle" class="say" opacity="0">step 1: <tspan fill="#ef4565">observe gaps.</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.13;.15;.48;.5;1" dur="8s" repeatCount="indefinite"/></text>
  <text x="395" y="57" text-anchor="middle" class="say" opacity="0">step 2: <tspan fill="#2cb67d">build solutions.</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.5;.52;.92;.95;1" dur="8s" repeatCount="indefinite"/></text>
</g>

<!-- scan beam from the magnifier to the gap -->
<polygon points="252,132 544,206 636,206" fill="#f9c74f" opacity="0">
  <animate attributeName="opacity" values="0;0;.16;.1;.16;0;0" keyTimes="0;.16;.2;.3;.42;.47;1" dur="8s" repeatCount="indefinite"/>
</polygon>

<!-- the world: two platforms with a gap -->
<g>
  <rect x="330" y="210" width="210" height="16" rx="4" fill="#232129" stroke="#3a3845"/>
  <rect x="640" y="210" width="190" height="16" rx="4" fill="#232129" stroke="#3a3845"/>
  <rect x="330" y="210" width="210" height="3" rx="1.5" fill="#7f5af0" opacity=".6"/>
  <rect x="640" y="210" width="190" height="3" rx="1.5" fill="#7f5af0" opacity=".6"/>
  <!-- flag on the far side -->
  <line x1="806" y1="210" x2="806" y2="178" stroke="#94a1b2" stroke-width="2"/>
  <path d="M806 178 L826 184 L806 190 Z" fill="#2cb67d"><animateTransform attributeName="transform" type="skewY" values="0;-6;0" dur="1.6s" repeatCount="indefinite"/></path>
</g>

<!-- gap highlight (observe) -->
<rect x="544" y="204" width="92" height="26" rx="5" fill="#ef4565" fill-opacity=".08" stroke="#ef4565" stroke-width="2" stroke-dasharray="6 4" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.18;.22;.46;.5;1" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/>
</rect>

<!-- the solution block drops in (build) -->
<rect x="541" y="-30" width="98" height="16" rx="4" fill="url(#solution)" opacity="0">
  <animate attributeName="y" values="-30;-30;210;204;210;210;-30" keyTimes="0;.5;.58;.61;.64;.99;1" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.5;.51;.9;.95;1" dur="8s" repeatCount="indefinite"/>
</rect>

<!-- impact sparkle + glow -->
<ellipse cx="590" cy="214" rx="90" ry="26" fill="url(#glow)" opacity="0">
  <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.58;.62;.76;1" dur="8s" repeatCount="indefinite"/>
</ellipse>
<g fill="#f9c74f">
  <circle cx="544" cy="204" r="0"><animate attributeName="r" values="0;0;6;0;0" keyTimes="0;.58;.61;.66;1" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="636" cy="204" r="0"><animate attributeName="r" values="0;0;6;0;0" keyTimes="0;.58;.61;.66;1" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="590" cy="196" r="0"><animate attributeName="r" values="0;0;4;0;0" keyTimes="0;.59;.62;.67;1" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="566" cy="194" r="0"><animate attributeName="r" values="0;0;3;0;0" keyTimes="0;.6;.63;.68;1" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="614" cy="194" r="0"><animate attributeName="r" values="0;0;3;0;0" keyTimes="0;.6;.63;.68;1" dur="8s" repeatCount="indefinite"/></circle>
</g>

<!-- a user who was stuck at the gap, now crosses -->
<g opacity="0">
  <animate attributeName="opacity" values="0;1;1;1;0;0" keyTimes="0;.04;.88;.9;.93;1" dur="8s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="360 0;505 0;505 0;780 0;780 0;360 0" keyTimes="0;.14;.64;.88;.99;1" dur="8s" repeatCount="indefinite"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur=".35s" repeatCount="indefinite"/>
    <circle cx="0" cy="190" r="6" fill="#f9c74f"/>
    <rect x="-5" y="197" width="10" height="12" rx="4" fill="#e0def4"/>
  </g>
</g>

<!-- labels -->
<text x="590" y="256" text-anchor="middle" class="lbl" fill="#ef4565" opacity="0">gap detected
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.24;.46;.5;1" dur="8s" repeatCount="indefinite"/></text>
<text x="590" y="256" text-anchor="middle" class="lbl" fill="#2cb67d" opacity="0">solution shipped ✓
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.62;.66;.9;.94;1" dur="8s" repeatCount="indefinite"/></text>

<!-- gapbot -->
<g transform="translate(90 40)">
  <!-- shadow -->
  <ellipse cx="70" cy="200" rx="40" ry="6" fill="#000" opacity=".45">
    <animate attributeName="rx" values="40;31;40" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </ellipse>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>

    <!-- hover jet -->
    <path d="M58 172 Q70 196 82 172 Z" fill="#2cb67d" opacity=".7">
      <animate attributeName="opacity" values=".35;.8;.35" dur=".5s" repeatCount="indefinite"/>
    </path>

    <!-- left arm: waves hello -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-35 40 126;45 40 126;15 40 126;45 40 126;15 40 126;-35 40 126;-35 40 126" keyTimes="0;.03;.06;.09;.12;.15;1" dur="8s" repeatCount="indefinite"/>
      <rect x="14" y="120" width="28" height="12" rx="6" fill="#6a55e8"/>
      <circle cx="13" cy="126" r="8" fill="#9b82ff"/>
    </g>

    <!-- right arm: holds the magnifier, raises it to inspect -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="25 100 126;25 100 126;-12 100 126;-6 100 126;-12 100 126;25 100 126;25 100 126" keyTimes="0;.14;.19;.3;.42;.48;1" dur="8s" repeatCount="indefinite"/>
      <rect x="98" y="120" width="30" height="12" rx="6" fill="#6a55e8"/>
      <circle cx="129" cy="126" r="8" fill="#9b82ff"/>
      <line x1="131" y1="122" x2="143" y2="108" stroke="#94a1b2" stroke-width="5" stroke-linecap="round"/>
      <circle cx="153" cy="96" r="14" fill="#f9c74f" fill-opacity=".18" stroke="#f9c74f" stroke-width="4"/>
      <path d="M145 90 Q149 85 155 85" stroke="#fffffe" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".8"/>
    </g>

    <!-- torso -->
    <rect x="60" y="108" width="20" height="10" fill="#4b36a8"/>
    <rect x="38" y="116" width="64" height="56" rx="20" fill="url(#torso)"/>
    <circle cx="70" cy="142" r="10" fill="#0f0e17"/>
    <circle cx="70" cy="142" r="4.5" fill="#2cb67d"><animate attributeName="opacity" values="1;.35;1" dur="1.4s" repeatCount="indefinite"/></circle>

    <!-- antenna -->
    <line x1="70" y1="34" x2="70" y2="15" stroke="#c6b8fa" stroke-width="4" stroke-linecap="round"/>
    <circle cx="70" cy="11" r="7" fill="#2cb67d" opacity=".5">
      <animate attributeName="r" values="7;16;7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0;.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="11" r="7" fill="#2cb67d"/>

    <!-- ears -->
    <rect x="10" y="60" width="12" height="28" rx="5" fill="#2cb67d"/>
    <rect x="118" y="60" width="12" height="28" rx="5" fill="#2cb67d"/>

    <!-- head -->
    <rect x="20" y="34" width="100" height="78" rx="26" fill="url(#head)"/>
    <rect x="32" y="49" width="76" height="48" rx="16" fill="#0f0e17"/>

    <!-- eyes: blink, then glance at the gap -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;7 3;7 3;0 0;0 0" keyTimes="0;.16;.2;.46;.5;1" dur="8s" repeatCount="indefinite"/>
      <ellipse cx="55" cy="72" rx="7" ry="9" fill="#2cb67d">
        <animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;.45;.5;.55;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="85" cy="72" rx="7" ry="9" fill="#2cb67d">
        <animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;.45;.5;.55;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="58" cy="68" r="2.2" fill="#fffffe"/>
      <circle cx="88" cy="68" r="2.2" fill="#fffffe"/>
    </g>
    <path d="M62 87 Q70 93 78 87" stroke="#2cb67d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="42" cy="86" r="4" fill="#ff8fab" opacity=".55"/>
    <circle cx="98" cy="86" r="4" fill="#ff8fab" opacity=".55"/>
  </g>
</g>
</svg>
